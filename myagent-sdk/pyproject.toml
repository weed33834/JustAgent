[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myagent_sdk"]
include = ["src/myagent_sdk/templates/**/*"]

[project]
name = "myagent-sdk"
version = "1.2.0"
description = "MyAgent plugin development SDK"
readme = "README.md"
license = { text = "CNCL-1.0" }
requires-python = ">=3.10"
authors = [
    { name = "MyAgent Team", email = "team@myagent.dev" },
]
dependencies = [
    "myagent>=1.2.0",
]

[project.urls]
Repository = "https://gitcode.com/badhope/myagent"
Issues = "https://gitcode.com/badhope/myagent/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "TCH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", "**/tests"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=myagent_sdk --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/myagent_sdk"]
branch = true

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv.sources]
myagent = { workspace = true }
