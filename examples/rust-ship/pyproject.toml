[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myagent-rust-ship"
version = "0.1.0"
description = "MyAgent-CLI language pack: Rust build artifacts and verify hints"
requires-python = ">=3.10"
dependencies = [
    "myagent>=1.0.0",
    "myagent-sdk>=1.0.0",
]

[project.entry-points."myagent.plugins"]
rust = "myagent_rust_ship.plugin:register"
