[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "justagent-rust-ship"
version = "0.1.0"
description = "JustAgent-CLI language pack: Rust build artifacts and verify hints"
requires-python = ">=3.10"
dependencies = [
    "justagent>=1.0.0",
    "justagent-sdk>=1.0.0",
]

[project.entry-points."justagent.plugins"]
rust = "myagent_rust_ship.plugin:register"
