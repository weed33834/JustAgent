[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoship-node-ship"
version = "0.1.0"
description = "AutoShip-CLI language pack: Node build artifacts and verify hints"
requires-python = ">=3.10"
dependencies = [
    "autoship>=1.0.0",
    "autoship-sdk>=1.0.0",
]

[project.entry-points."autoship.plugins"]
node = "autoship_node_ship.plugin:register"
