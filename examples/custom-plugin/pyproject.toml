[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myagent-project-guard"
version = "0.1.0"
description = "Real-world MyAgent-CLI plugin example: project health checks"
requires-python = ">=3.10"
dependencies = [
    "myagent>=0.2.0b1",
    "myagent-sdk>=0.1.0b1",
]

[project.entry-points."myagent.plugins"]
custom = "myagent_custom_plugin.plugin:register"
