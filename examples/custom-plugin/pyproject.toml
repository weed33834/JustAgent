[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "justagent-project-guard"
version = "0.1.0"
description = "Real-world JustAgent-CLI plugin example: project health checks"
requires-python = ">=3.10"
dependencies = [
    "justagent>=0.2.0b1",
    "justagent-sdk>=0.1.0b1",
]

[project.entry-points."justagent.plugins"]
custom = "myagent_custom_plugin.plugin:register"
