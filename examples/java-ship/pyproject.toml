[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "justagent-java-ship"
version = "0.1.0"
description = "JustAgent-CLI language pack: Java build artifacts and verify hints"
requires-python = ">=3.10"
dependencies = [
    "justagent>=1.0.0",
    "justagent-sdk>=1.0.0",
]

[project.entry-points."justagent.plugins"]
java = "myagent_java_ship.plugin:register"
