name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The project is a uv workspace (justagent + justagent-sdk); install via
      # uv so the local justagent-sdk member resolves from the workspace
      # instead of being fetched (and failing) from PyPI. Retry a few times to
      # ride out transient PyPI download flakiness.
      - name: Install package and dev dependencies (uv workspace)
        run: |
          for i in 1 2 3; do
            if uv sync --extra dev; then
              echo "uv sync succeeded (attempt $i)"
              exit 0
            fi
            echo "uv sync attempt $i failed — transient network? retrying in 8s..."
            sleep 8
          done
          echo "uv sync failed after 3 attempts"
          exit 1
      - name: Run tests (excluding integration)
        run: uv run --no-sync pytest -m "not integration" --no-cov
