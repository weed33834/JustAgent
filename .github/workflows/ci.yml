name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The project is a uv workspace (justagent + justagent-sdk); install via
      # uv so the local justagent-sdk member resolves from the workspace
      # instead of being fetched (and failing) from PyPI.
      - name: Install package and dev dependencies (uv workspace)
        run: uv sync --extra dev
      - name: Run tests (excluding integration)
        run: uv run --no-sync pytest -m "not integration" --no-cov
