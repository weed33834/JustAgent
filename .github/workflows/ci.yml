name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-check:
    name: Layer check (engine knows nothing about verticals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Engine/vertical layering rules
        run: bash scripts/layer-check.sh

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: uv sync --extra dev --extra web
      - name: Ruff check
        run: uv run --no-sync ruff check src tests
      - name: Ruff format check
        run: uv run --no-sync ruff format --check src tests
      - name: Mypy (strict gate)
        run: uv run --no-sync mypy src --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Restore the uv dependency cache so unchanged deps don't need PyPI again.
      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
      # The project is a uv workspace (justagent + justagent-sdk); install via
      # uv so the local justagent-sdk member resolves from the workspace
      # instead of being fetched (and failing) from PyPI. Use a mirror for
      # download robustness and retry a few times to ride out transient
      # network flakiness.
      - name: Install package and dev dependencies (uv workspace)
        env:
          UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple/
        run: |
          for i in 1 2 3 4 5; do
            if uv sync --extra dev --extra web; then
              echo "uv sync succeeded (attempt $i)"
              exit 0
            fi
            echo "uv sync attempt $i failed — transient network? retrying in 8s..."
            sleep 8
          done
          echo "uv sync failed after 5 attempts"
          exit 1
      - name: Run tests (excluding integration) with coverage gate
        env:
          COLUMNS: "200"
        run: uv run --no-sync pytest -m "not integration"
      - name: SDK tests
        run: uv run --no-sync pytest justagent-sdk/tests -q --no-cov
