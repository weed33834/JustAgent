<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JustAgent Web</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #f6f8fc; --surface: #fff; --border: #e6e8f2; --text: #1b2333;
    --text2: #5c6476; --text3: #96a0b4; --primary: #6366f1; --primary-bg: #eef2ff;
    --grad: linear-gradient(135deg,#6366f1,#8b5cf6); --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  .wrap { display: flex; height: 100vh; }
  .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; }
  .brand { display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border); }
  .logo { width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800; }
  .brand h1 { font-size:16px; font-weight:700; }
  .brand small { color: var(--text3); font-size:11px; display:block; }
  .tabs { display:flex; gap:4px; padding:10px 12px; border-bottom:1px solid var(--border); }
  .tab { flex:1; padding:8px; border:none; background:transparent; color:var(--text2);
    border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600; transition:.15s; }
  .tab.active { background: var(--primary-bg); color: var(--primary); }
  .panel { flex:1; overflow:auto; padding:12px; }
  .panel h3 { font-size:13px; color:var(--text2); margin:10px 2px 8px; }
  .item { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .item .t { font-weight:600; font-size:13px; }
  .item .d { color:var(--text2); font-size:12px; margin-top:2px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; background:var(--primary-bg); color:var(--primary); margin-left:6px; }
  .main { flex:1; display:flex; flex-direction:column; }
  .chat-head { padding:14px 20px; border-bottom:1px solid var(--border); background:var(--surface); font-weight:600; }
  .chat { flex:1; overflow:auto; padding:20px; }
  .msg { display:flex; gap:10px; margin-bottom:16px; max-width:82%; }
  .msg.user { flex-direction:row-reverse; margin-left:auto; }
  .msg .av { width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0; }
  .msg .b { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 14px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; }
  .msg.user .b { background:var(--grad); color:#fff; border:none; }
  .inputbar { padding:14px 20px; border-top:1px solid var(--border); background:var(--surface); display:flex; gap:10px; }
  .inputbar textarea { flex:1; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; resize:none; font-family:inherit; outline:none; }
  .inputbar textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,.18); }
  .send { width:44px; height:44px; border:none; border-radius:12px; background:var(--grad); color:#fff; font-size:16px; cursor:pointer; }
  .form { display:flex; flex-direction:column; gap:8px; }
  .form input, .form textarea, .form select { border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; }
  .btn { background:var(--primary); color:#fff; border:none; border-radius:8px; padding:8px; font-size:13px; cursor:pointer; font-weight:600; }
  .hint { color:var(--text3); font-size:11.5px; margin-top:4px; }
  .empty { color:var(--text3); font-size:12.5px; text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">J</div>
      <div><h1>JustAgent</h1><small>司法 AI 智能体平台 · Web</small></div>
    </div>
    <div style="padding:8px 12px">
      <select id="projectSel" onchange="switchProject()" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px">
        <option value="">默认项目</option>
      </select>
    </div>
    <div class="tabs">
      <button class="tab active" data-panel="chat" onclick="switchTab('chat')">对话</button>
      <button class="tab" data-panel="cases" onclick="switchTab('cases')">案件</button>
      <button class="tab" data-panel="evidence" onclick="switchTab('evidence')">证据</button>
      <button class="tab" data-panel="laws" onclick="switchTab('laws')">法条</button>
      <button class="tab" data-panel="system" onclick="switchTab('system')">系统</button>
    </div>
    <div class="panel" id="panel-chat">
      <p class="hint" style="padding:6px 2px">在右侧对话，或直接管理案件/证据/法条。司法功能无需模型也可用；对话需配置模型后端，且保持多轮记忆。</p>
      <h3>案件 / 证据 / 法条</h3>
      <div id="mini-list"></div>
    </div>
    <div class="panel" id="panel-cases" style="display:none">
      <h3>新建案件</h3>
      <div class="form">
        <input id="c-no" placeholder="案号，如（2026）京01民初1号" />
        <input id="c-cause" placeholder="案由" />
        <input id="c-court" placeholder="法院" />
        <button class="btn" onclick="createCase()">创建案件</button>
      </div>
      <h3>案件列表</h3>
      <button class="btn" style="margin-bottom:8px" onclick="exportState()">⬇ 导出司法状态</button>
      <button class="btn" style="margin-bottom:8px" onclick="window.open('/api/report','_blank')">📄 导出报表(HTML)</button>
      <div style="margin-bottom:8px"><select id="docType" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px"></select></div>
      <div id="case-list"></div>
    </div>
    <div class="panel" id="panel-evidence" style="display:none">
      <h3>证据列表</h3>
      <div id="evidence-list"></div>
    </div>
    <div class="panel" id="panel-laws" style="display:none">
      <h3>添加法条</h3>
      <div class="form">
        <input id="l-name" placeholder="法律名称" />
        <input id="l-article" placeholder="条号，如 第一百四十三条" />
        <textarea id="l-content" placeholder="法条正文" rows="2"></textarea>
        <select id="l-domain"><option value="civil">民事</option><option value="criminal">刑事</option><option value="administrative">行政</option></select>
        <button class="btn" onclick="addLaw()">添加法条</button>
      </div>
      <h3>法律库</h3>
      <div class="form">
        <input id="ks-q" placeholder="检索法条，如 民事法律行为" />
        <button class="btn" onclick="searchLaw()">检索</button>
      </div>
      <div id="law-search"></div>
      <div id="law-list"></div>
    </div>
    <div class="panel" id="panel-system" style="display:none">
      <h3>诊断</h3>
      <div id="sys-doctor"></div>
      <h3>配置 / 模型</h3>
      <div id="sys-config"></div>
      <h3>会话</h3>
      <div id="sys-sessions"></div>
      <h3>插件</h3>
      <div id="sys-plugins"></div>
      <h3>定时任务</h3>
      <div class="form">
        <input id="t-name" placeholder="任务名" />
        <input id="t-cron" placeholder="Cron，如 0 9 * * *" value="0 9 * * *" />
        <input id="t-cmd" placeholder="命令，如 justagent judicial case list" />
        <button class="btn" onclick="addTask()">新建任务</button>
      </div>
      <div id="sys-tasks"></div>
      <h3>指标</h3>
      <div id="metrics-chart" style="height:220px"></div>
      <h3>案件分布</h3>
      <div id="cases-chart" style="height:200px"></div>
      <h3>法条分布</h3>
      <div id="laws-chart" style="height:200px"></div>
      <h3>项目</h3>
      <div id="sys-projects"></div>
      <h3>通知</h3>
      <div id="sys-notify"></div>
      <h3>审计</h3>
      <div id="sys-audit"></div>
    </div>
  </aside>

  <main class="main">
    <div class="chat-head">JustAgent 对话
      <span style="float:right">
        <button class="send" style="width:auto;padding:2px 10px;font-size:12px" onclick="loadState();addMsg('assistant','已刷新')">🔄 刷新</button>
        <button class="send" style="width:auto;padding:2px 10px;font-size:12px" onclick="logout()">🚪 登出</button>
      </span>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inputbar">
      <button class="send" style="width:auto;padding:0 12px;font-size:13px" onclick="pickFile()" title="上传附件">📎</button>
      <button class="send" style="width:auto;padding:0 12px;font-size:13px" onclick="pickImage()" title="图像识别">🖼️</button>
      <button class="send" style="width:auto;padding:0 12px;font-size:13px" id="micBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
      <button class="send" style="width:auto;padding:0 12px;font-size:13px" onclick="speakLast()" title="朗读回复">🔊</button>
      <textarea id="input" rows="1" placeholder="问任何事，如：列出所有案件 / 为案件生成证据清单 / 检索法条…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <button class="send" onclick="send()">➤</button>
    </div>
  </main>
</div>
<script>
let state = { cases: [], evidence: [], laws: [] };
let history = [];
let token = localStorage.getItem('justagent_token') || '';
// Default-deny auth: attach the credential to every request automatically.
const _origFetch = window.fetch.bind(window);
window.fetch = function(input, init){
  init = Object.assign({}, init||{});
  if(token) init.headers = Object.assign({'Authorization':'Bearer '+token}, init.headers||{});
  return _origFetch(input, init);
};
let projectSel = '';
function authHeaders(){ return token ? { 'Authorization': 'Bearer '+token } : {}; }
function projHeaders(){ const h=authHeaders(); if(projectSel) h['X-JustAgent-Project']=projectSel; return h; }
async function loadProjects(){
  try{ const r=await (await fetch('/api/projects',{headers:authHeaders()})).json();
    const sel=document.getElementById('projectSel');
    sel.innerHTML='<option value="">默认项目</option>'+r.items.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    if(projectSel) sel.value=projectSel;
  }catch(e){}
}
function switchProject(){ projectSel=document.getElementById('projectSel').value; loadState(); addMsg('assistant', projectSel?'已切换到项目 '+projectSel:'已切换到默认项目'); }

function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function addMsg(role, text){
  const chat=document.getElementById('chat');
  const m=document.createElement('div'); m.className='msg '+role;
  m.innerHTML = '<div class="av">'+(role==='user'?'我':'J')+'</div><div class="b">'+esc(text)+'</div>';
  chat.appendChild(m); chat.scrollTop=chat.scrollHeight;
  return m.querySelector('.b');
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.panel===name));
  ['chat','cases','evidence','laws','system'].forEach(p=>document.getElementById('panel-'+p).style.display = p===name?'':'none');
  if(name==='system') loadSystem();
}
function renderMini(){
  const el=document.getElementById('mini-list');
  if(!state.cases.length && !state.evidence.length && !state.laws.length){ el.innerHTML='<div class="empty">暂无数据</div>'; return; }
  el.innerHTML='';
  if(state.cases.length) el.innerHTML+='<div class="item"><div class="t">案件 '+state.cases.length+'</div></div>';
  if(state.evidence.length) el.innerHTML+='<div class="item"><div class="t">证据 '+state.evidence.length+'</div></div>';
  if(state.laws.length) el.innerHTML+='<div class="item"><div class="t">法条 '+state.laws.length+'</div></div>';
}
function renderCases(){
  const el=document.getElementById('case-list');
  el.innerHTML = state.cases.length ? state.cases.map(c=>`<div class="item"><div class="t">${esc(c.case_number||c.id.slice(0,8))}<span class="badge">${esc(c.status)}</span></div><div class="d">${esc(c.cause)} · ${esc(c.court)} · ${c.parties} 当事人 · ${c.timeline} 时间线</div><button class="btn" style="margin-top:6px" onclick="generateDoc('${c.id}')">生成文书</button></div>`).join('') : '<div class="empty">暂无案件</div>';
}
async function loadDocTypes(){
  try{ const r=await (await fetch('/api/judicial/doc/types')).json();
    document.getElementById('docType').innerHTML=r.items.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  }catch(e){}
}
function renderEvidence(){
  const el=document.getElementById('evidence-list');
  const auditBtn='<button class="btn" style="margin-top:8px" onclick="auditEvidence(\'\')">⚖️ 证据链审计</button>';
  el.innerHTML = state.evidence.length ? state.evidence.map(e=>`<div class="item"><div class="t">${esc(e.name)}<span class="badge">${esc(e.admissible)}</span></div><div class="d">${esc(e.type)} · 证明力: ${esc(e.strength)}</div></div>`).join('') + '<button class="btn" style="margin-top:8px" onclick="analyzeEvidence(\'\')">🔍 证据链分析</button>' + auditBtn : '<div class="empty">暂无证据</div><button class="btn" style="margin-top:8px" onclick="analyzeEvidence(\'\')">🔍 证据链分析</button>' + auditBtn;
}
function renderLaws(){
  const el=document.getElementById('law-list');
  el.innerHTML = state.laws.length ? state.laws.map(l=>`<div class="item"><div class="t">${esc(l.citation)}</div><div class="d">${esc(l.law_name)} · ${esc(l.domain)} · ${esc(l.status)}</div></div>`).join('') : '<div class="empty">暂无法条</div>';
}
async function loadState(){
  try{ state = await (await fetch('/api/state',{headers:projHeaders()})).json(); }catch(e){ state={cases:[],evidence:[],laws:[]}; }
  renderMini(); renderCases(); renderEvidence(); renderLaws();
}
async function sendVision(text){
  const bubble=addMsg('assistant','识别中…');
  try{
    const r=await fetch('/api/vision',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({prompt:text||'请描述这张图片并提取关键信息',image:attachedImage})});
    const d=await r.json(); bubble.textContent=d.reply||'(无输出)';
    history.push({role:'assistant',content:d.reply||''});
  }catch(e){ bubble.textContent='识别失败: '+e; }
}
async function send(){
  const input=document.getElementById('input'); const text=input.value.trim(); if(!text) return;
  input.value=''; addMsg('user', text); history.push({role:'user', content:text});
  if(attachedImage){ await sendVision(text); attachedImage=null; return; }
  const bubble=addMsg('assistant','…');
  let reply='';
  const chat=document.getElementById('chat');
  try{
    const res=await fetch('/api/chat/stream',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({message:text, history, session_id:getSession()})});
    if(res.status===401){ await doLogin(); bubble.textContent='已登录，请重发消息'; return; }
    if(!res.ok || !res.body){ const d=await res.json().catch(()=>({})); bubble.textContent=d.reply||('请求失败: '+res.status); return; }
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,idx); buf=buf.slice(idx+2);
        if(line.startsWith('data: ')){ try{ const ev=JSON.parse(line.slice(6));
          if(ev.type==='delta'){ reply+=ev.content||''; bubble.textContent=reply; chat.scrollTop=chat.scrollHeight; }
          else if(ev.type==='tool_start'){ reply+='\n[🔧 调用工具: '+ev.tool+']\n'; bubble.textContent=reply; }
          else if(ev.type==='done'){ reply=ev.content||reply; bubble.textContent=reply; history.push({role:'assistant',content:reply}); await loadState(); return; }
        }catch(e){} }
      }
    }
  }catch(e){ bubble.textContent='请求失败: '+e; }
}
async function delSession(id){ const r=await fetch('/api/sessions/'+id,{method:'DELETE',headers:authHeaders()}); loadSystem(); addMsg('assistant', r.ok?'已删除会话':'删除失败'); }
function getSession(){ let s=localStorage.getItem('justagent_session'); if(!s){ s='s'+Date.now()+Math.random().toString(36).slice(2,8); localStorage.setItem('justagent_session',s);} return s; }
async function doLogin(){
  const cred=prompt('需要登录。输入 用户名:密码（或直接粘贴访问令牌）：');
  if(!cred) return;
  if(cred.indexOf(':')>=0){ const [u,p]=cred.split(':'); const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.trim(),password:p.trim()})});
    if(r.ok){ const d=await r.json(); token=d.token; localStorage.setItem('justagent_token',token); addMsg('assistant','已登录为 '+d.username+'（'+d.role+'）'); }
    else addMsg('assistant','登录失败：'+r.status);
  } else { token=cred; localStorage.setItem('justagent_token',token); addMsg('assistant','已设置访问令牌'); }
}
function logout(){ token=''; localStorage.removeItem('justagent_token'); addMsg('assistant','已登出'); }
async function loadSystem(){
  try{
    const doctor=await (await fetch('/api/doctor',{method:'POST'})).json();
    document.getElementById('sys-doctor').innerHTML=doctor.map(c=>`<div class="item"><div class="t">${esc(c.name)} <span class="badge">${esc(c.status)}</span></div><div class="d">${esc(c.detail||'')}</div></div>`).join('');
  }catch(e){ document.getElementById('sys-doctor').innerHTML='<div class="empty">诊断不可用</div>'; }
  try{
    const cfg=await (await fetch('/api/config')).json();
    const models=await (await fetch('/api/models')).json();
    document.getElementById('sys-config').innerHTML=
      '<div class="item"><div class="t">配置</div><div class="d">模型后端 '+models.items.length+' 个</div></div>'+
      models.items.map(m=>`<div class="item"><div class="t">${esc(m.provider)} <span class="badge">${esc(m.model)}</span></div><div class="d">${esc(m.base_url)} · key ${esc(m.key)}</div></div>`).join('');
  }catch(e){}
  try{
    const sess=await (await fetch('/api/sessions')).json();
    document.getElementById('sys-sessions').innerHTML = sess.items.length ? sess.items.map(s=>`<div class="item"><div class="t">${esc(s.title||s.id.slice(0,8))} <span class="badge">${esc(s.status)}</span></div><div class="d">${esc(s.id.slice(0,8))}</div><button class="btn" style="margin-top:6px" onclick="delSession('${s.id}')">删除</button></div>`).join('') : '<div class="empty">暂无会话</div>';
  }catch(e){}
  try{
    const pl=await (await fetch('/api/plugins')).json();
    document.getElementById('sys-plugins').innerHTML = pl.items.length ? pl.items.map(p=>`<div class="item"><div class="t">${esc(p.name)}</div><div class="d">${esc(p.version)} · ${esc(p.trust)}</div></div>`).join('') : '<div class="empty">暂无插件</div>';
  }catch(e){}
  try{
    const tk=await (await fetch('/api/schedule')).json();
    document.getElementById('sys-tasks').innerHTML = tk.items.length ? tk.items.map(t=>`<div class="item"><div class="t">${esc(t.name)} <span class="badge">${t.enabled?'启用':'停用'}</span></div><div class="d">${esc(t.schedule)} · 上次 ${fmtTs(t.last_run)}</div></div>`).join('') : '<div class="empty">暂无定时任务</div>';
  }catch(e){ document.getElementById('sys-tasks').innerHTML='<div class="empty">定时任务不可用</div>'; }
  try{
    const m=await (await fetch('/api/metrics')).json();
    const evs=Object.entries(m.events||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(window.echarts && evs.length){ const el=document.getElementById('metrics-chart'); const c=echarts.init(el);
      c.setOption({tooltip:{trigger:'axis'},xAxis:{type:'category',data:evs.map(e=>e[0]),axisLabel:{rotate:30,fontSize:9}},yAxis:{type:'value'},series:[{type:'bar',data:evs.map(e=>e[1]),itemStyle:{color:'#6366f1'}}]});
    }
  }catch(e){}
  try{
    const n=await (await fetch('/api/notifications')).json();
    document.getElementById('sys-notify').innerHTML = n.items.length ? n.items.slice(0,20).map(x=>`<div class="item"><div class="t">${esc(x.kind)} <span class="badge">${new Date(x.ts*1000).toLocaleTimeString()}</span></div><div class="d">${esc(x.message)}</div></div>`).join('') : '<div class="empty">暂无通知</div>';
  }catch(e){}
  try{
    const a=await (await fetch('/api/audit')).json();
    document.getElementById('sys-audit').innerHTML = a.items.length ? a.items.slice(0,20).map(x=>`<div class="item"><div class="t">${esc(x.event||x.action||'')}</div><div class="d">${esc((x.trace_id||'').slice(0,8))} · ${esc((x.ts||'').toString().slice(0,19))}</div></div>`).join('') : '<div class="empty">暂无审计</div>';
  }catch(e){ document.getElementById('sys-audit').innerHTML='<div class="empty">审计不可用</div>'; }
  try{
    const st=await (await fetch('/api/state')).json();
    if(window.echarts){
      const byStatus={}; st.cases.forEach(c=>byStatus[c.status]=(byStatus[c.status]||0)+1);
      const sEl=document.getElementById('cases-chart'); if(Object.keys(byStatus).length) echarts.init(sEl).setOption({series:[{type:'pie',radius:'60%',data:Object.entries(byStatus).map(([n,v])=>({name:n,value:v}))}]});
      const byDomain={}; st.laws.forEach(l=>byDomain[l.domain]=(byDomain[l.domain]||0)+1);
      const lEl=document.getElementById('laws-chart'); if(Object.keys(byDomain).length){ const dom=Object.entries(byDomain); echarts.init(lEl).setOption({tooltip:{},xAxis:{type:'category',data:dom.map(d=>d[0])},yAxis:{type:'value'},series:[{type:'bar',data:dom.map(d=>d[1]),itemStyle:{color:'#8b5cf6'}}]}); }
    }
  }catch(e){}
  try{
    const pr=await (await fetch('/api/projects')).json();
    document.getElementById('sys-projects').innerHTML = '<div class="item"><div class="t">当前项目</div><div class="d">'+esc(pr.current)+'</div></div>'+(pr.items.length?pr.items.map(p=>`<div class="item"><div class="t">${esc(p.name)}</div><div class="d">${esc(p.path)}</div></div>`).join(''):'');
  }catch(e){ document.getElementById('sys-projects').innerHTML='<div class="empty">项目不可用</div>'; }
}
function fmtTs(ts){ if(!ts||ts<=0) return 'never'; return new Date(ts*1000).toLocaleString(); }
let attachedImage=null;
function pickImage(){ const f=document.createElement('input'); f.type='file'; f.accept='image/*'; f.onchange=()=>{ const file=f.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ attachedImage=r.result; }; r.readAsDataURL(file); addMsg('user','[已附图片，发送后识别]'); }; f.click(); }
function pickFile(){ const f=document.createElement('input'); f.type='file'; f.onchange=()=>{ const file=f.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ const text=file.name+'\n'+r.result.slice(0,4000); const inp=document.getElementById('input'); inp.value=(inp.value+' [附件 '+file.name+']').trim(); }; r.readAsText(file); }; f.click(); }
let recognizing=false; let recognition=null;
function toggleVoice(){ if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){ alert('当前浏览器不支持语音输入'); return; }
  if(recognizing){ recognition&&recognition.stop(); recognizing=false; document.getElementById('micBtn').textContent='🎤'; return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR(); recognition.lang='zh-CN'; recognition.interimResults=false;
  recognition.onresult=(e)=>{ const t=e.results[0][0].transcript; const inp=document.getElementById('input'); inp.value=(inp.value+' '+t).trim(); };
  recognition.onend=()=>{ recognizing=false; document.getElementById('micBtn').textContent='🎤'; };
  recognition.onerror=()=>{ recognizing=false; document.getElementById('micBtn').textContent='🎤'; };
  recognition.start(); recognizing=true; document.getElementById('micBtn').textContent='⏺';
}
function speak(text){ if('speechSynthesis' in window){ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; window.speechSynthesis.speak(u); } }
function speakLast(){ const ms=document.querySelectorAll('.msg.assistant .b'); if(ms.length) speak(ms[ms.length-1].textContent); }
async function addTask(){
  const r=await fetch('/api/schedule',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({name:val('t-name'),schedule:val('t-cron'),command:val('t-cmd')})});
  const d=await r.json(); loadSystem(); addMsg('assistant', d.ok?('已新建定时任务 '+d.name):('失败: '+(d.detail||d.error||'')));
}
async function searchLaw(){
  const q=val('ks-q'); if(!q) return;
  const r=await fetch('/api/knowledge/search',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},projHeaders()),body:JSON.stringify({query:q,top_k:6})});
  const d=await r.json();
  document.getElementById('law-search').innerHTML = d.hits.length ? d.hits.map(h=>`<div class="item"><div class="t">${esc(h.citation)} <span class="badge">${h.score.toFixed(2)}</span></div><div class="d">${esc(h.content||'')}</div></div>`).join('') : '<div class="empty">无结果</div>';
}
async function analyzeEvidence(caseId){
  const r=await fetch('/api/judicial/evidence/analyze',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},projHeaders()),body:JSON.stringify({case_id:caseId||''})});
  const d=await r.json();
  addMsg('assistant','证据链分析：完整度 '+d.completeness_score+'，矛盾 '+d.contradiction_count+' 处\n'+(d.summary||''));
}
async function auditEvidence(caseId){
  const r=await fetch('/api/judicial/evidence/audit',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},projHeaders()),body:JSON.stringify({case_id:caseId||''})});
  if(!r.ok){ addMsg('assistant','证据链审计失败：'+r.status); return; }
  const d=await r.json();
  const icon={'通过':'✅','有瑕疵':'⚠️'}[d.verdict]||'❌';
  const cov=(d.claim_coverage||[]).map(c=>(c.covered?'✅ ':'❌ ')+c.claim_description).join('\n');
  const lines=[
    icon+' 证据链审计结论：'+d.verdict+'（完整度 '+(d.chain? d.chain.completeness_score : '-')+'）',
    '保管链条问题 '+(d.custody_issues||[]).length+' 项',
    ...(d.custody_issues||[]).map(i=>'  • '+i),
    '时间线问题 '+(d.timeline_issues||[]).length+' 项',
    ...(d.timeline_issues||[]).map(i=>'  • '+i),
    '同源佐证警告 '+(d.independence_warnings||[]).length+' 项',
    ...(d.independence_warnings||[]).map(i=>'  • '+i),
  ];
  if(cov) lines.push('诉请覆盖：\n'+cov);
  if(d.summary) lines.push(d.summary);
  addMsg('assistant',lines.join('\n'));
}
async function generateDoc(caseId){
  const dt=(document.getElementById('docType')&&document.getElementById('docType').value)||'evidence_list';
  const r=await fetch('/api/judicial/doc',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},projHeaders()),body:JSON.stringify({case_id:caseId,doc_type:dt})});
  const d=await r.json();
  addMsg('assistant', d.ok?('已生成《'+dt+'》：\n'+(d.content||'').slice(0,1500)):('生成失败: '+(d.error||'')));
}
async function exportState(){
  const r=await fetch('/api/state',{headers:projHeaders()}); const d=await r.json();
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='justagent-state.json'; a.click(); URL.revokeObjectURL(a.href);
  addMsg('assistant','已导出司法状态（JSON）');
}
async function createCase(){
  const r=await fetch('/api/judicial/case',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},projHeaders()),
    body:JSON.stringify({case_number:val('c-no'),cause:val('c-cause'),court:val('c-court')})});
  const d=await r.json(); await loadState(); addMsg('assistant', d.ok?('已创建案件 '+d.case_number):('创建失败: '+d.error));
}
async function addLaw(){
  const r=await fetch('/api/judicial/law',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},projHeaders()),
    body:JSON.stringify({law_name:val('l-name'),article_number:val('l-article'),content:val('l-content'),domain:val('l-domain')})});
  const d=await r.json(); await loadState(); addMsg('assistant', d.ok?('已添加法条 '+d.citation):('添加失败: '+d.error));
}
function val(id){ return document.getElementById(id).value.trim(); }
window.onload=()=>{ loadState(); loadProjects(); loadDocTypes(); addMsg('assistant','你好，我是 JustAgent。我可以帮你管理案件、证据、法条，生成法律文书。直接说需求即可。'); };
</script>
