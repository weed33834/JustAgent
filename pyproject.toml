[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justagent"]

[project]
name = "justagent"
version = "3.1.0"
description = "JustAgent — judicial AI agent platform: case material organization, evidence review, legal document generation, and judicial workflow automation. Intelligence for Justice."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "JustAgent Team", email = "team@justagent.dev" },
]
keywords = [
    "ai-agent",
    "judicial-ai",
    "legal-ai",
    "case-management",
    "evidence-review",
    "legal-document-generation",
    "law",
    "justice",
    "llm",
    "cli",
    "rag",
    "knowledge-management",
    "local-ai",
    "mcp",
    "legal-tech",
    "multi-agent",
    "web-console",
    "fastapi",
    "docker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.15.0",
    "pluggy>=1.5.0",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "psutil>=6.1.0",
    "packaging>=24.2.0",
    "cryptography>=44.0.0",
    "tomli-w>=1.2.0",
    "openai>=1.40.0",
    "structlog>=25.1.0",
    # Safe expression evaluation (replaces eval() in workflow engine)
    "simpleeval>=1.0.0",
    # Chinese text segmentation for judicial NLP
    "jieba>=0.42.1",
    "diskcache",
]

[project.optional-dependencies]
security = ["semgrep>=1.100.0", "pip-audit>=2.7.0"]
tui = ["textual>=0.50.0"]
mcp = ["mcp>=1.0.0"]
# JustAgent enterprise extensions
knowledge = [
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
]
rag = [
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "respx>=0.22.0",
    "vcrpy>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pyfakefs>=5.7.0",
    "freezegun>=1.5.0",
    "cyclonedx-bom>=4.0.0",
    "pyinstaller>=6.0.0",
    "mkdocs-material>=9.0.0",
    "textual>=0.50.0",
    "justagent-sdk",
]

[project.scripts]
justagent = "justagent.cli.main:cli_entrypoint"

[project.entry-points."justagent.tools"]
legal = "justagent.verticals.legal.agent_tool:make_legal_tool"

[project.entry-points."justagent.cli"]
legal = "justagent.verticals.legal.cli"

[project.urls]
Repository = "https://gitcode.com/badhope/JustAgent"
Issues = "https://gitcode.com/badhope/JustAgent/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "scripts"]
exclude = ["**/__pycache__", "**/tests"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=justagent --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
markers = [
    "integration: tests that require real external services (slow, optional)",
]

[tool.coverage.run]
source = ["src/justagent"]
branch = true

[tool.semgrep]
config = "auto"

[tool.uv.workspace]
members = [".", "justagent-sdk"]

[tool.uv.sources]
justagent-sdk = { workspace = true }
