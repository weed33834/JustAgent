[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myagent"]

[project]
name = "myagent"
version = "2.0.0"
description = "MyAgent — a local-first AI coding agent with interactive REPL, tool calling, session persistence, and permission engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "MyAgent Team", email = "team@myagent.dev" },
]
keywords = ["cli", "automation", "git", "developer-tools", "local-ai", "litellm", "structlog"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.15.0",
    "pluggy>=1.5.0",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "psutil>=6.1.0",
    "packaging>=24.2.0",
    "cryptography>=44.0.0",
    "tomli-w>=1.2.0",
    "litellm>=1.60.0",
    "structlog>=25.1.0",
]

[project.optional-dependencies]
ai = ["litellm>=1.60.0"]
security = ["semgrep>=1.100.0", "pip-audit>=2.7.0"]
tui = ["textual>=0.50.0"]
mcp = ["mcp>=1.0.0"]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "respx>=0.22.0",
    "vcrpy>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pyfakefs>=5.7.0",
    "freezegun>=1.5.0",
    "cyclonedx-bom>=4.0.0",
    "pyinstaller>=6.0.0",
    "mkdocs-material>=9.0.0",
    "build>=1.2.0",
    "twine>=6.0.0",
    "textual>=0.50.0",
    "myagent-sdk",
]

[project.scripts]
myagent = "myagent.cli.main:cli_entrypoint"

[project.urls]
Repository = "https://gitcode.com/badhope/myagent"
Issues = "https://gitcode.com/badhope/myagent/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "scripts"]
exclude = ["**/__pycache__", "**/tests"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=myagent --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
markers = [
    "integration: tests that require real external services (slow, optional)",
]

[tool.coverage.run]
source = ["src/myagent"]
branch = true

[tool.semgrep]
config = "auto"

[tool.uv.workspace]
members = [".", "myagent-sdk"]

[tool.uv.sources]
myagent-sdk = { workspace = true }
